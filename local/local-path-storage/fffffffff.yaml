apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fffffffff-data
  namespace: local-path-storage
  labels:
    app: fffffffff
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: 782fc7fd-d8f3-40a2-9e77-d8626188e87a
    portainer-run/git-branch: main
    portainer-run/git-path: local/local-path-storage/fffffffff.yaml
    portainer-run/vibe-source-path: local/local-path-storage/fffffffff/src
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fffffffff
  namespace: local-path-storage
  labels:
    app: fffffffff
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: 782fc7fd-d8f3-40a2-9e77-d8626188e87a
    portainer-run/git-branch: main
    portainer-run/git-path: local/local-path-storage/fffffffff.yaml
    portainer-run/vibe-source-path: local/local-path-storage/fffffffff/src
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fffffffff
  template:
    metadata:
      labels:
        app: fffffffff
        managed-by: portainer-run
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
        - name: vibe-sync
          image: alpine/git:latest
          command:
            - sh
            - '-c'
            - >-
              git config --global http.sslVerify false && git clone --depth 1 --branch main
              https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/stevensbkang/portainer-run-testing /tmp/repo && mkdir -p
              /usr/share/nginx/html && cp -r /tmp/repo/local/local-path-storage/fffffffff/src/. /usr/share/nginx/html/
              && rm -rf /tmp/repo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fffffffff-git-credentials
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fffffffff-git-credentials
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: fffffffff
          image: nginxinc/nginx-unprivileged:alpine
          command:
            - sh
            - '-c'
            - nginx -g 'daemon off;'
          workingDir: /usr/share/nginx/html
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: fffffffff-data
---
apiVersion: v1
kind: Service
metadata:
  name: fffffffff
  namespace: local-path-storage
  labels:
    app: fffffffff
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: 782fc7fd-d8f3-40a2-9e77-d8626188e87a
    portainer-run/git-branch: main
    portainer-run/git-path: local/local-path-storage/fffffffff.yaml
    portainer-run/vibe-source-path: local/local-path-storage/fffffffff/src
spec:
  type: NodePort
  selector:
    app: fffffffff
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
