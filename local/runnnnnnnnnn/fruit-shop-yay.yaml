apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fruit-shop-yay-data
  namespace: runnnnnnnnnn
  labels:
    app: fruit-shop-yay
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: f867c021-be9b-4011-a30d-78e554034a9b
    portainer-run/git-branch: main
    portainer-run/git-path: local/runnnnnnnnnn/fruit-shop-yay.yaml
    portainer-run/vibe-source-path: local/runnnnnnnnnn/fruit-shop-yay/src
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruit-shop-yay
  namespace: runnnnnnnnnn
  labels:
    app: fruit-shop-yay
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: f867c021-be9b-4011-a30d-78e554034a9b
    portainer-run/git-branch: main
    portainer-run/git-path: local/runnnnnnnnnn/fruit-shop-yay.yaml
    portainer-run/vibe-source-path: local/runnnnnnnnnn/fruit-shop-yay/src
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fruit-shop-yay
  template:
    metadata:
      labels:
        app: fruit-shop-yay
        managed-by: portainer-run
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
        - name: vibe-sync
          image: alpine/git:latest
          command:
            - sh
            - '-c'
            - >-
              git config --global http.sslVerify false && git clone --depth 1 --branch main
              https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/stevensbkang/portainer-run-testing /tmp/repo && mkdir -p
              /usr/share/nginx/html && cp -r /tmp/repo/local/runnnnnnnnnn/fruit-shop-yay/src/. /usr/share/nginx/html/ &&
              rm -rf /tmp/repo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fruit-shop-yay-git-credentials
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fruit-shop-yay-git-credentials
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: fruit-shop-yay
          image: nginxinc/nginx-unprivileged:alpine
          command:
            - sh
            - '-c'
            - nginx -g 'daemon off;'
          workingDir: /usr/share/nginx/html
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: fruit-shop-yay-data
---
apiVersion: v1
kind: Service
metadata:
  name: fruit-shop-yay
  namespace: runnnnnnnnnn
  labels:
    app: fruit-shop-yay
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: f867c021-be9b-4011-a30d-78e554034a9b
    portainer-run/git-branch: main
    portainer-run/git-path: local/runnnnnnnnnn/fruit-shop-yay.yaml
    portainer-run/vibe-source-path: local/runnnnnnnnnn/fruit-shop-yay/src
spec:
  type: ClusterIP
  selector:
    app: fruit-shop-yay
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fruit-shop-yay
  namespace: runnnnnnnnnn
  labels:
    app: fruit-shop-yay
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: f867c021-be9b-4011-a30d-78e554034a9b
    portainer-run/git-branch: main
    portainer-run/git-path: local/runnnnnnnnnn/fruit-shop-yay.yaml
    portainer-run/vibe-source-path: local/runnnnnnnnnn/fruit-shop-yay/src
spec:
  rules:
    - host: yay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fruit-shop-yay
                port:
                  number: 8080
