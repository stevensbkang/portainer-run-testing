apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fruit-shop-data
  namespace: fruit-shop
  labels:
    app: fruit-shop
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: d44bcbcf-6c90-441d-84b0-bf3c1bc40b21
    portainer-run/git-branch: main
    portainer-run/git-path: kubernetes-edge-agent-standard/fruit-shop/fruit-shop.yaml
    portainer-run/vibe-source-path: kubernetes-edge-agent-standard/fruit-shop/fruit-shop/src
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruit-shop
  namespace: fruit-shop
  labels:
    app: fruit-shop
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: d44bcbcf-6c90-441d-84b0-bf3c1bc40b21
    portainer-run/git-branch: main
    portainer-run/git-path: kubernetes-edge-agent-standard/fruit-shop/fruit-shop.yaml
    portainer-run/vibe-source-path: kubernetes-edge-agent-standard/fruit-shop/fruit-shop/src
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fruit-shop
  template:
    metadata:
      labels:
        app: fruit-shop
        managed-by: portainer-run
    spec:
      initContainers:
        - name: vibe-sync
          image: alpine/git:latest
          command:
            - sh
            - '-c'
            - >-
              git config --global http.sslVerify false && git clone --depth 1 --branch main
              https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/stevensbkang/portainer-run-testing /tmp/repo && mkdir -p
              /usr/share/nginx/html && cp -r /tmp/repo/kubernetes-edge-agent-standard/fruit-shop/fruit-shop/src/.
              /usr/share/nginx/html/ && rm -rf /tmp/repo
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fruit-shop-git-credentials
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fruit-shop-git-credentials
                  key: token
      containers:
        - name: fruit-shop
          image: nginx:alpine
          command:
            - sh
            - '-c'
            - nginx -g 'daemon off;'
          workingDir: /usr/share/nginx/html
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: fruit-shop-data
---
apiVersion: v1
kind: Service
metadata:
  name: fruit-shop
  namespace: fruit-shop
  labels:
    app: fruit-shop
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: d44bcbcf-6c90-441d-84b0-bf3c1bc40b21
    portainer-run/git-branch: main
    portainer-run/git-path: kubernetes-edge-agent-standard/fruit-shop/fruit-shop.yaml
    portainer-run/vibe-source-path: kubernetes-edge-agent-standard/fruit-shop/fruit-shop/src
spec:
  type: NodePort
  selector:
    app: fruit-shop
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
