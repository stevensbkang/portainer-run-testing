apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk-testing-manifest-builder
  namespace: test-ns-0001
  labels:
    app: sk-testing-manifest-builder
    managed-by: portainer-run
  annotations:
    portainer-run/git-target-id: eead49a5-8493-42dc-835f-73522560167c
    portainer-run/git-branch: main
    portainer-run/git-path: test-ns-0001/sk-testing-manifest-builder.yaml
    portainer-run/deploy-type: manifest-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk-testing-manifest-builder
  template:
    metadata:
      labels:
        app: sk-testing-manifest-builder
        managed-by: portainer-run
    spec:
      containers:
        - name: sk-testing-manifest-builder
          image: nginx:latest
          imagePullPolicy: Always
